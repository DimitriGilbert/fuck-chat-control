# coturn STUN+TURN configuration for fuck-eu-chat-control (Phase 0).
#
# Mounted into the coturn container at /etc/coturn/turnserver.conf by
# docker-compose.yml. Directive names verified against coturn 4.15 source
# (src/apps/relay/mainrelay.c) and the example turnserver.conf shipped in
# examples/etc/turnserver.conf — the long option names here are the canonical
# config-file forms (e.g. --use-auth-secret becomes use-auth-secret).
#
# coturn's config parser does NOT do shell-style $VARIABLE expansion: any
# `$TURN_…` token written into this file would be taken VERBATIM and used as
# the literal secret/realm value (an open-relay footgun). The shared secret
# and realm are therefore injected as CLI FLAGS from
# deploy/coturn/entrypoint.sh (`--static-auth-secret`, `--realm`), which read
# them from the runtime env (TURN_SHARED_SECRET, TURN_REALM). CLI args override
# config-file values in coturn, so the directives are deliberately ABSENT
# below. KEEP THE SECRET OUT OF THE CLIENT BUNDLE — only the ephemeral
# username/credential pair minted by /ice-config reaches the browser.
#
# RUNTIME GUARD (not compose-time): an empty TURN_SHARED_SECRET is refused by
# deploy/coturn/entrypoint.sh (wired as the service `entrypoint:` in
# docker-compose.yml), NOT by a compose `${VAR:?...}` guard. This is because
# Dokploy injects runtime env into the container AFTER `docker compose`
# resolves interpolation, so a compose-level fail-fast would prevent the
# container from ever starting. The entrypoint exits 1 with a clear log line
# when the secret is unset/empty — refusing to run coturn as an open relay
# without breaking Dokploy's runtime-env injection model.

# --- Listeners -------------------------------------------------------------
# Default TURN/STUN listener. UDP+TCP on 3478. Operators MUST publish 3478/udp
# (and 3478/tcp for TCP-fallback clients) on the host.
listening-port=3478

# TLS/DTLS listener on 5349 (turns:). Requires cert/pkey below. Operators that
# don't terminate TURN-TLS can leave cert/pkey unset and coturn will skip this
# listener (see the warning in mainrelay.c set_ctx()).
tls-listening-port=5349

# Cert + private key for the TLS listener. The compose service mounts these
# from /etc/coturn/certs (operator-provided). Uncomment and set paths when
# turns: is in use.
#cert=/etc/coturn/certs/turn_cert.pem
#pkey=/etc/coturn/certs/turn_key.pem

# --- Relay port range ------------------------------------------------------
# The UDP port range coturn allocates relay endpoints from. MUST be published
# on the host (docker-compose.yml publishes the full range). 49152–49172 is a
# 21-port window — enough for a handful of concurrent relays; widen for higher
# fan-out and keep min-port..max-port contiguous on the host publish.
min-port=49152
max-port=49172

# --- Relay abuse quotas (R7:F3) --------------------------------------------
# The last line of defence against relay abuse: even with valid (minted)
# credentials, these cap what ONE allocation and the WHOLE server will relay.
# The 21-port range above already bounds concurrent allocations; these bound
# the per-allocation bandwidth, credential-lifetime, and allocation churn.
#
# Per-relay-session bandwidth cap: 512 KiB/s. A chat's opus voice needs
# ~100 kbps and a video call ~2.5 Mbps at 720p — 512 KiB/s (4 Mbps) covers a
# two-peer call with headroom while making the relay useless for piracy/
# tunneling abuse.
max-bps=524288

# Total concurrent allocations across all users. Deliberately above the
# 21-port relay range (allocations cannot exceed relayed endpoints anyway) —
# this is the explicit, self-documenting cap rather than relying on the
# implicit port bound. Raise together with min-port/max-port.
total-quota=50

# Per-USERNAME concurrent allocation cap. NOTE: /ice-config mints a fresh
# 128-bit random username per request (R7:F1), so every allocation is its own
# "user" and this quota never binds under the default web deployment. It is
# kept for operators who switch to shared/static usernames, and it documents
# intent: no single username may hog allocations.
user-quota=4

# Reject Allocate requests whose nonce is older than this many seconds.
# coturn's default (600) is fine, but pinning it documents the knob and lets
# operators tighten it without re-reading coturn's man page.
stale-nonce=600

# Cap the LIFETIME a client may request for one allocation. WebRTC peers
# refresh allocations every ~4 minutes; an hour is ~15 refresh cycles of
# headroom while preventing a one-shot credential from pinning a relay
# endpoint for the full credential TTL.
max-allocate-lifetime=3600

# --- NAT / external address (R7:F2) ----------------------------------------
# When coturn runs behind NAT (the common docker deployment), it learns the
# container's PRIVATE ip as its relay address and advertises that private IP
# as a relayed candidate — peers on the internet can never reach it, and
# connectivity fails silently. Set `external-ip` to the host's PUBLIC IPv4
# (e.g. external-ip=203.0.113.10) when the published 3478/relay ports are
# NAT-forwarded to this container.
#
# Like the secret and realm, this is NOT set here: the value is
# deployment-specific and is injected as a CLI flag (--external-ip) by
# deploy/coturn/entrypoint.sh from the TURN_EXTERNAL_IP runtime env var.
# Leave it unset for non-NAT deployments (coturn auto-detects the public ip
# when the container has a public interface).

# --- Long-term credentials + REST API (TURN REST API, RFC 5389 §10.2) ------
# use-auth-secret switches credential validation from the static user table to
# the "TURN REST API" model: the server holds ONE shared secret and accepts
# any username of the form "<expiry-unix-seconds>:<arbitrary-id>" paired with
# credential = base64(hmac-sha1(username, shared-secret)). This is what lets
# /ice-config mint per-request time-limited credentials without ever storing
# per-user state on the TURN server.
# ===========================================================================
# AUTH-POSTURE LOCK — DO NOT REMOVE OR COMMENT OUT.
# `use-auth-secret` is the SOLE directive enforcing credential-checked TURN
# allocations here. Removing or commenting it makes coturn accept ANONYMOUS
# allocations (open relay) regardless of any `static-auth-secret` value — the
# shared secret only gates the REST-API auth model that THIS directive
# selects. `lt-cred-mech` is intentionally NOT added alongside it: coturn
# 4.15.0 emits a deprecation warning when both are present, and
# `use-auth-secret` alone is the recommended REST-API posture. If you are
# tempted to "simplify" auth here, do not — add an explicit fail-closed test
# for anonymous allocations first.
# ===========================================================================
use-auth-secret

# `static-auth-secret` and `realm` are NOT set in this file. coturn's config
# parser does not expand `$VARIABLE`, so a literal `$TURN_SHARED_SECRET` here
# would be stored verbatim and the REST-API auth check would run against that
# literal string — an open-relay posture that also never matches the
# HMAC-SHA1 credentials minted by /ice-config. Both values are injected as CLI
# flags (`--static-auth-secret`, `--realm`) from deploy/coturn/entrypoint.sh,
# which overrides any config-file value. See the file header for the full
# rationale.

# --- Behaviour -------------------------------------------------------------
# Add MESSAGE-INTEGRITY fingerprints to responses (helps clients detect
# middlebox tampering). Recommended.
fingerprint

# The built-in telnet CLI is OFF by default in coturn 4.x; no directive is
# needed. The `no-cli` directive was deprecated in 4.15.0 and emits an ERROR
# log on every boot if present — it has been removed. Do not re-add it.

# Prevent the TURN server from relaying traffic to multicast destinations
# (defence-in-depth against abused allocations used for broadcast
# amplification). Loopback peers need no directive here: coturn 4.15.0
# denies them by default (they only become relayable with the explicit
# --allow-loopback-peers flag), and 4.15.0 rejects `no-loopback-peers`
# itself ("WARNING: Bad configuration format") on every boot — so it is
# deliberately absent.
no-multicast-peers

# --- Private-network relay denylist (R5:F1) --------------------------------
# coturn 4.15.0 denies zero addresses (0.0.0.0/8, ::), loopback, IPv4
# link-local 169.254.0.0/16 (incl. the 169.254.169.254 cloud-metadata
# service), fe80::/10, ULA fc00::/7 and site-local fec0::/10 unconditionally
# (good_peer_addr in ns_turn_server.c) — but NOT RFC1918 or CGNAT space: those
# fall through to the peer allow/deny lists and are relayable by default.
# /ice-config is unauthenticated and mints valid TURN credentials to anyone,
# so without these denies a credentialed allocation can relay into the private
# compose network (the docker bridge lives in 172.16/12) — including the
# deliberately unpublished `web` service — and onward into any RFC1918 segment
# reachable from the container. Do NOT extend this list with 0.0.0.0/8,
# 127.0.0.0/8 or 169.254.0.0/16: coturn 4.15.0 already denies them
# unconditionally, so entries for them are dead weight. The ip-start-ip-end
# range form is mandatory — the 4.15.0 parser aborts startup on CIDR notation
# for this directive.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
# RFC 5737 documentation ranges (TEST-NET-1/2/3): never legitimate relay
# destinations; denied alongside the private space for the same reason.
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255

# Log to stdout so `docker logs` captures everything (no log file).
log-file=stdout
simple-log

# Keep verbose mode off in production; flip on for debugging only.
#verbose
